# 소관 부처 목록 및 키워드 (2026-07 기준)
#
# keywords: 1차 후보 필터용 (넓게 잡아서 AI에 넘긴다)
#   ANTHROPIC_API_KEY 설정 시: 느슨한 키워드로 후보 추출 → Claude가 최종 판단
#   API 키 없을 때: 아래 strict_keywords로 폴백
# strict_keywords: API 없을 때 사용하는 엄격한 키워드 (구체적 복합어 위주)
# exclude_keywords: strict 모드에서 이 키워드가 있으면 해당 부처 분류 제외
# global_exclude: 어느 섹션에도 분류하지 않는 전체 공통 제외 키워드 (strict 모드)

global_exclude:
  - 지지율
  - 전당대회
  - 경선
  - 당 대표
  - ARF
  - 비핵화
  - 선관위
  - 선거
  - 특검
  - 압수수색

